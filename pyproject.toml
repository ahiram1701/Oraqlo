[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "oraqlo"
dynamic = ["version"]
description = "Motor de estrategia bajo incertidumbre: forecasting probabilístico calibrado + planificación adversarial, con LLMs multi-proveedor."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alberto H. Saucedo G." }]
dependencies = []

[project.optional-dependencies]
quant = ["numpy"]
tui = ["textual>=1.0"]

[project.scripts]
oraqlo = "oraqlo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4",
    "textual>=1.0",
]

# --- versión: derivada del tag git vX.Y.Z (lo crea release-please) ---
[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/oraqlo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oraqlo"]

# --- tests ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# --- lint / formato ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # la longitud la gestiona el formateador
    "RUF001",  # el proyecto está en español: caracteres ambiguos en strings
    "RUF002",
    "RUF003",
    "E731",    # lambdas con nombre: estilo aceptado en este proyecto
    "E741",    # `l` como variable en comprensiones cortas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# La TUI se retira en la Fase 5 (sustituida por la app web): no se pule.
"src/oraqlo/tui/**" = ["RUF012", "SIM117"]

# --- tipos ---
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
