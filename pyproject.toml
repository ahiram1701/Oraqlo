[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "oraqlo"
dynamic = ["version"]
description = "Motor de estrategia bajo incertidumbre: forecasting probabilístico calibrado + planificación adversarial, con LLMs multi-proveedor."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alberto H. Saucedo G." }]
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.1",
    "openai>=3.51.0",
    "packaging>=26.3",
    "pillow>=11 ; sys_platform == 'win32'",
    "platformdirs>=4.14.5",
    "pydantic>=2.14.3",
    "pystray>=0.19 ; sys_platform == 'win32'",
    "python-dotenv>=1.2.4",
    "pywebpush>=2.5.0",
    "pywebview>=5 ; sys_platform == 'win32'",
    "tomlkit>=0.13",
    "uvicorn[standard]>=0.54.0",
    "windows-toasts>=1.3 ; sys_platform == 'win32'",
]

[project.scripts]
oraqlo = "oraqlo.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4",
    "httpx>=0.28.1",
]

# --- versión: derivada del tag git vX.Y.Z (lo crea release-please) ---
[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/oraqlo/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oraqlo"]
# El frontend compilado está en .gitignore (es salida de build), pero debe ir en el wheel.
artifacts = ["src/oraqlo/api/static/**"]

[tool.hatch.build.targets.sdist]
# uv build genera el wheel a partir del sdist: el frontend tiene que viajar también aquí.
artifacts = ["src/oraqlo/api/static/**"]
exclude = ["web/node_modules"]

# --- tests ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# --- lint / formato ---
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # la longitud la gestiona el formateador
    "RUF001",  # el proyecto está en español: caracteres ambiguos en strings
    "RUF002",
    "RUF003",
    "E731",    # lambdas con nombre: estilo aceptado en este proyecto
    "E741",    # `l` como variable en comprensiones cortas
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# Fixtures compartidas importadas desde otro módulo de tests.
"tests/test_userconfig.py" = ["F811"]
"tests/test_desktop.py" = ["F811"]
"tests/test_goals_edit.py" = ["F811"]
"tests/test_jobs_cancel.py" = ["F811"]
"tests/test_analisis.py" = ["F811"]
"tests/test_scorecard.py" = ["F811"]
"tests/test_duelos.py" = ["F811"]
"tests/test_prediccion.py" = ["F811"]

# --- tipos ---
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
