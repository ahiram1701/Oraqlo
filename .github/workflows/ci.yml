name: CI

on:
  pull_request:
  push:
    branches: [main]
  # El PR de release lo crea el GITHUB_TOKEN, y GitHub no dispara workflows con sus
  # eventos; release.yml lanza este CI por workflow_dispatch sobre la rama del PR
  # para que los checks obligatorios existan y el PR pueda mergearse.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pyright

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows es la plataforma de producción (Oraqlo corre en un PC Windows).
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # la versión se deriva de los tags git
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q --cov --cov-report=term:skip-covered
      - run: uv run oraqlo version
      - name: Dependencias de la app de escritorio (ventana, bandeja, avisos)
        if: runner.os == 'Windows'
        run: uv run python -c "import webview, pystray, windows_toasts, oraqlo.desktop, oraqlo.services.notify"

  web:
    name: Web (tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  build:
    name: Build del paquete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar el frontend dentro del paquete
        working-directory: web
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - name: El wheel lleva el frontend, instala y arranca
        run: |
          unzip -l dist/*.whl | grep -q "oraqlo/api/static/index.html"
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/oraqlo version

  installer:
    name: Instalador Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar el frontend dentro del paquete
        working-directory: web
        run: npm ci && npm run build
      - uses: astral-sh/setup-uv@v7
      - run: uv build --wheel
      - name: Compilar Oraqlo-Setup.exe
        shell: pwsh
        run: ./installer/build-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: oraqlo-setup
          path: dist/Oraqlo-Setup-*.exe
          retention-days: 7
