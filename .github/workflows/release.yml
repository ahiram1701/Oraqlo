name: Release

# 1) release-please mantiene abierto un "PR de release" (CHANGELOG + versión) a
#    partir de los commits convencionales que entran en main.
# 2) Al mergear ese PR crea el tag vX.Y.Z y la GitHub Release.
# 3) Entonces se construye el wheel, se calculan los SHA256 y se firma su
#    procedencia; todo se adjunta a la Release. Es lo que instala el auto-updater.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # para lanzar el CI sobre la rama del PR de release

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GitHub deja en "action_required" el CI de los PRs que abre el bot de
      # Actions hasta que alguien lo aprueba; aquí se aprueba solo (es nuestro PR).
      - name: Aprobar el CI del PR de release
        if: steps.rp.outputs.release_created != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" --json headRefName --jq '.[0].headRefName // empty')
          [ -z "$branch" ] && { echo "No hay PR de release abierto."; exit 0; }
          sleep 20  # da tiempo a que GitHub cree las ejecuciones del último push
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --branch "$branch" --status action_required --json databaseId --jq '.[].databaseId'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" && echo "Aprobada la ejecución $id"
          done

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # attestation de procedencia (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar el frontend dentro del paquete
        working-directory: web
        run: npm ci && npm test && npm run build
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q
      - run: uv build
      - name: Comprobar que el wheel lleva el frontend
        run: unzip -l dist/*.whl | grep -q "oraqlo/api/static/index.html"
      - name: Adjuntar también el instalador de Windows
        run: cp scripts/install-windows.ps1 dist/
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.whl
      - name: Adjuntar artefactos a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --clobber
