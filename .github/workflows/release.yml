name: Release

# 1) release-please mantiene abierto un "PR de release" (CHANGELOG + versión) a
#    partir de los commits convencionales que entran en main.
# 2) Al mergear ese PR crea el tag vX.Y.Z y la GitHub Release.
# 3) Entonces se construye el wheel, se calculan los SHA256 y se firma su
#    procedencia; todo se adjunta a la Release. Es lo que instala el auto-updater.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # para lanzar el CI sobre la rama del PR de release

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Los PRs que abre GITHUB_TOKEN no disparan workflows: lanzamos el CI a mano
      # sobre la rama del PR de release para que tenga los checks requeridos.
      - name: Lanzar el CI sobre el PR de release
        if: steps.rp.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" --json headRefName --jq '.[0].headRefName // empty')
          if [ -n "$branch" ]; then
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          else
            echo "No hay PR de release abierto."
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # attestation de procedencia (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Compilar el frontend dentro del paquete
        working-directory: web
        run: npm ci && npm test && npm run build
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q
      - run: uv build
      - name: Comprobar que el wheel lleva el frontend
        run: unzip -l dist/*.whl | grep -q "oraqlo/api/static/index.html"
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - name: Adjuntar artefactos a la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --clobber
